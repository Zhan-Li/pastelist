name: Release

# Every push to main builds the app. When the version in Resources/Info.plist
# has no release yet, the build is published as one, tagged v<version>. So a
# release is: bump the version, add a CHANGELOG section, push.
#
# A hand-pushed tag (git tag v1.0.0 && git push origin v1.0.0) still works,
# and "Run workflow" builds a given version without publishing it.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `inputs.version` is caller-supplied text. Pass it through the
      # environment rather than expanding it into the script, and reject
      # anything that is not a plain version number.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PUBLISH=false
          if [ -n "$INPUT_VERSION" ]; then
            VALUE="$INPUT_VERSION"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            VALUE="${GITHUB_REF_NAME#v}"
            PUBLISH=true
          else
            VALUE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
            if gh release view "v$VALUE" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VALUE" >/dev/null; then
              echo "v$VALUE is already released; building only"
            else
              PUBLISH=true
            fi
          fi
          case "$VALUE" in
            ""|*[!0-9.]*) echo "::error::refusing to build version '$VALUE'"; exit 1 ;;
          esac
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: ./release.sh "${{ steps.version.outputs.value }}"

      - name: Verify universal binary
        run: |
          ARCHS=$(lipo -archs build/PasteList.app/Contents/MacOS/PasteList)
          echo "architectures: $ARCHS"
          case "$ARCHS" in *arm64*) ;; *) echo "::error::missing arm64 slice"; exit 1 ;; esac
          case "$ARCHS" in *x86_64*) ;; *) echo "::error::missing x86_64 slice"; exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: PasteList-dmg
          path: dist/*.dmg

      - name: Publish release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          NOTES="$(mktemp)"

          # Lift this version's section out of CHANGELOG.md.
          awk -v want="## $VERSION" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section

          if [ -s /tmp/changelog-section ]; then
            echo "## What changed" >> "$NOTES"
            cat /tmp/changelog-section >> "$NOTES"
          else
            echo "::warning::no CHANGELOG.md entry for $VERSION"
          fi

          cat >> "$NOTES" <<'EOF'
          ## Install

          1. Download the `.dmg` below and drag **PasteList** to Applications.
          2. **Right-click** PasteList ▸ **Open** ▸ **Open**. Gatekeeper blocks
             the first launch because PasteList is not signed with a paid Apple
             Developer ID. Once per install, not once per launch.

          Requires macOS 14 or later. Universal — Apple Silicon and Intel.
          EOF

          # Re-running this job, or a release created by hand for the same
          # tag, must not fail: update what is there instead of colliding.
          # On a main push the tag does not exist yet; --target makes
          # `gh release create` cut it at this commit.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --title "PasteList $TAG" \
              --notes-file "$NOTES"
            gh release upload "$TAG" dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.dmg \
              --target "$GITHUB_SHA" \
              --title "PasteList $TAG" \
              --notes-file "$NOTES"
          fi
