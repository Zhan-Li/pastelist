name: Release

# Push a tag to publish a release:
#     git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # `inputs.version` is caller-supplied text. Pass it through the
      # environment rather than expanding it into the script, and reject
      # anything that is not a plain version number.
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VALUE="$INPUT_VERSION"
          else
            VALUE="${GITHUB_REF_NAME#v}"
          fi
          case "$VALUE" in
            ""|*[!0-9.]*) echo "::error::refusing to build version '$VALUE'"; exit 1 ;;
          esac
          echo "value=$VALUE" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: ./release.sh "${{ steps.version.outputs.value }}"

      - name: Verify universal binary
        run: |
          ARCHS=$(lipo -archs build/PasteList.app/Contents/MacOS/PasteList)
          echo "architectures: $ARCHS"
          case "$ARCHS" in *arm64*) ;; *) echo "::error::missing arm64 slice"; exit 1 ;; esac
          case "$ARCHS" in *x86_64*) ;; *) echo "::error::missing x86_64 slice"; exit 1 ;; esac

      - uses: actions/upload-artifact@v4
        with:
          name: PasteList-dmg
          path: dist/*.dmg

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(mktemp)"

          # Lift this version's section out of CHANGELOG.md.
          awk -v want="## ${GITHUB_REF_NAME#v}" '
            $0 == want { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section

          if [ -s /tmp/changelog-section ]; then
            echo "## What changed" >> "$NOTES"
            cat /tmp/changelog-section >> "$NOTES"
          else
            echo "::warning::no CHANGELOG.md entry for ${GITHUB_REF_NAME#v}"
          fi

          cat >> "$NOTES" <<'EOF'
          ## Install

          1. Download the `.dmg` below and drag **PasteList** to Applications.
          2. **Right-click** PasteList ▸ **Open** ▸ **Open**. Gatekeeper blocks
             the first launch because PasteList is not signed with a paid Apple
             Developer ID. Once per install, not once per launch.

          Requires macOS 14 or later. Universal — Apple Silicon and Intel.
          EOF

          gh release create "$GITHUB_REF_NAME" dist/*.dmg \
            --title "PasteList $GITHUB_REF_NAME" \
            --notes-file "$NOTES"
